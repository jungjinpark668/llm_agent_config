# Learned behavioral patterns. Each has a project (global or project name) and
# a confidence (0.0-1.0): raise when validated, lower when contradicted, prune <0.3.

instincts:
  - id: rpi-gpio-exclusive-precheck
    project: beamforming-lms-tracker-intel16-test
    confidence: 0.95
    trigger: >
      About to launch any RPi job that drives the chip over GPIO — rpi-sync
      then run, a tmux launch, or any ssh command that scans / resets /
      clocks / reconfigures the chip.
    action: >
      ALWAYS first check the Pi for a concurrent run:
      `ssh <pi> "tmux ls 2>/dev/null; pgrep -af 'venv/bin/python' | grep -v grep"`.
      If any chip-test tmux session (ro_freq/ro_temp/divcheck/scan_*) or
      scratch/scripts python process is active, do NOT launch — report what is
      running and wait (or ask) before starting. GPIO is one shared physical
      resource; concurrent drivers silently corrupt scan/clock state. No
      parallelism of RPi-GPIO work, ever.
    evidence: >
      User directive 2026-06-14. Physical chip test; RPi bit-bangs scan chains,
      clock, and resets on shared BCM pins. See rpi-gpio-single-run-rule.md.

  - id: chip-never-wrong-predict-first
    project: beamforming-lms-tracker-tsmc28-test
    confidence: 0.9
    trigger: >
      Any bench/hardware result mismatches the golden/expected value.
    action: >
      Standing assumption: the DUT is never wrong — the fault is in the test
      code, golden model, or stimulus schedule. NO hardware-fault theorizing
      and NO guessing: derive the expected behavior cycle-by-cycle from the
      references (RTL, apr.v, sim waveforms, TB) — "toggle X => state becomes
      S1, then toggle Y => expect S2" — set that predicted timeline FIRST,
      then diff measurement against it. Config writes only STAGE values;
      a domain clock edge COMMITS them — verify every clocked config target
      got its commit edge before suspecting anything else.
    evidence: >
      Designer doctrine (general rule, stated 2026-07-09). Validated same day:
      tsmc28 SPI head mismatch was a missing clk_update commit edge (test-code
      bug), not silicon — found in minutes once traced edge-by-edge in RTL.

  - id: mismatch-shape-triage
    project: beamforming-lms-tracker-tsmc28-test
    confidence: 0.85
    trigger: >
      Classifying golden-vs-received mismatches in any data-path test.
    action: >
      Never one "mismatch" bucket. Split exact / near-miss (small structured
      deltas, correlated with golden) / garbage (full-scale) BEFORE counting.
      Near-miss points at a wrong golden-model input (init state, commit
      timing, enable gating); garbage points at protocol/path. Mixed classes
      = two distinct problems. Also: no conclusions from underdetermined fits
      (check equations vs unknowns before calling a residual "proof").
    evidence: >
      2026-07-09: lumping near-miss + garbage into one count fabricated fake
      corruption laws and a dead probe program; splitting them solved it.

  - id: chip-behavior-notes-auto-append
    project: beamforming-lms-tracker-tsmc28-test
    confidence: 0.9
    trigger: >
      Any newly discovered/verified chip behavior (RTL mechanism, timing,
      register semantics, silicon-observed behavior) during any task.
    action: >
      Automatically append the finding to the matching EXISTING vault
      chip-behavior note (cdot datapath, gsc-lms datapath, spi protocol,
      scan-chain, clock/power, etc.) with file:line citations. Note length
      does not matter; correctness does. Also CORRECT any existing statement
      the new finding contradicts — never leave a known-wrong claim standing.
      Do not create new notes for this; extend the existing architecture set.
    evidence: >
      User directive 2026-07-09 ("keep updating chip behavior context...
      keep adding the note what you found; no care about length I only care
      whether note is correct or not").

  - id: calibrated-params-from-primary-note-before-bench
    project: beamforming-lms-tracker-tsmc28-test
    confidence: 0.9
    trigger: >
      Any bench/hardware launch whose flow has parameters ever described as
      "calibrated", "pinned", or "swept", or that the plan lists as a risk.
    action: >
      Before the FIRST launch: resolve every such parameter's value from the
      primary vault note / campaign log that calibrated it, read line by
      line personally (sub-agent summaries are leads, not evidence). Never
      launch on CLI defaults for such parameters. Close plan risk items
      (look the value up or run the cheap control) before launch, not after
      failure. Never transfer config conclusions between flows/clocking
      regimes without direct evidence in the target flow.
    evidence: >
      2026-08-30 GTRI chip run: first 6-pass launch frozen (a_ind/w static)
      because tick_edge_offset=1 CLI default was used although
      gsc-lms-track-test-family.md documents "offset 0/1 = updates land on
      zero samples -> frozen" and the 200k/2.3M methodology used offset 7;
      additionally an unnecessary scan-bit override was generalized from the
      sync-div flow comment that the baseline never needed. Cost: one wasted
      bench cycle; stock flow + offset 7 tracked immediately.

  - id: zero-stuffed-times4-period-law
    project: beamforming-lms-tracker-tsmc28-test
    confidence: 0.9
    trigger: >
      Any chip run configuring an update/period/counter value while using
      zero-stuffed (chunk-0-only) SPI transport.
    action: >
      Chip counters count CHIP samples; zero-stuffed transport makes 1 real
      sample = 4 chip samples. EVERY period-valued chip setting = 4x the
      python real-sample period (counter_stop = 4T-1). Host frame-anchored
      ticks stay in REAL-sample units (tick_every_frames = T). Stage
      clk_update_counter_stop_init.txt explicitly; the absent-file default
      (49) is silent and wrong for any T != 50. UNIVERSAL law: chip period = 4*T chip samples in every mode. Sync-div: divider realizes it (counter_stop=4T-1 sets the pulse). External-tick: host frame spacing IS the period and pulse timing is purely the host edge schedule; still stage counter_stop=4T-1 for on-chip period consumers.
    evidence: >
      2026-08-30 GTRI runs: user stated the x4/chunk-0 fact three times before
      it was applied; the law existed only in chip_adaptive_run.py's comment
      ("T-1 vs 4T-1"). Silicon readback showed counter_stop=49 while host
      ticked T=2; tracking ran at ~1/5 the model rate with doubled direction
      reversals until counter files were staged.
